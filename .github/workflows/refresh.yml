name: Refresh market data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "relay.py"
      - "test_relay.py"
      - "config/universe.json"
      - "universe_cli.py"
      - ".github/workflows/refresh.yml"
  schedule:
    # 08:35 KST, Monday-Friday
    - cron: "35 23 * * 0-4"

    # 09:35-15:35 KST, Monday-Friday
    - cron: "35 0-6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s . -v

      - name: Collect NAVER data
        id: collect
        shell: bash
        run: |
          set +e
          python relay.py all
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data

          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "Refresh NAVER market data"
            git push
          fi

      - name: Fail after publishing error files
        if: steps.collect.outputs.exit_code != '0'
        run: |
          echo "Collector reported one or more failures."
          exit 1
